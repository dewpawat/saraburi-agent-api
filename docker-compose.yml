services:
  saraburi-agent-api:
    container_name: saraburi-agent-api
    image: saraburi-agent-api:prod
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 18080 --workers 2
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
